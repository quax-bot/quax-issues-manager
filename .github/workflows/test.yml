name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Clone this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Clone the QuaX validator and triage schema
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Teskann/QuaX
          path: quax
          persist-credentials: false
          sparse-checkout: .github/triage

      - name: Run the tests
        run: node --test scripts/post.test.js
